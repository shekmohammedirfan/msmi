<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MSMI AI - Advanced AI Workspace</title>
  
  <!-- Modern Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=Fira+Code:wght@400;500&display=swap" rel="stylesheet" />

  <!-- Font Awesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />

  <!-- KaTeX for Mathematics -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.css" />
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/contrib/auto-render.min.js"></script>

  <!-- Marked.js for Markdown -->
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

  <!-- Highlight.js for Code Syntax Highlighting -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.8.0/styles/atom-one-dark.min.css" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.8.0/highlight.min.js"></script>

  <style>
    :root {
      --primary-red: #E53935;
      --primary-hover: #D32F2F;
      --accent-red: #FF1744;
      --bg-white: #FFFFFF;
      --bg-light: #F8F9FA;
      --panel-bg: rgba(255, 255, 255, 0.95);
      --text-dark: #1A1A1A;
      --text-muted: #666666;
      --border-color: #E0E0E0;
      --shadow-sm: 0 4px 12px rgba(229, 57, 53, 0.08);
      --shadow-lg: 0 10px 30px rgba(0, 0, 0, 0.1);
      --radius: 16px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Outfit', sans-serif;
    }

    body {
      background: linear-gradient(135deg, #FFFFFF 0%, #FFEBEE 100%);
      color: var(--text-dark);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      background: rgba(255, 255, 255, 0.9);
      backdrop-filter: blur(10px);
      border-bottom: 2px solid #FFCDD2;
      padding: 1rem 2rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }

    .brand-icon {
      background: linear-gradient(135deg, var(--primary-red), var(--accent-red));
      color: white;
      width: 42px;
      height: 42px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.3rem;
      box-shadow: 0 4px 10px rgba(229, 57, 53, 0.3);
      animation: pulse 2s infinite alternate;
    }

    @keyframes pulse {
      0% { transform: scale(1); box-shadow: 0 4px 10px rgba(229, 57, 53, 0.3); }
      100% { transform: scale(1.05); box-shadow: 0 6px 16px rgba(229, 57, 53, 0.5); }
    }

    .brand-title {
      font-size: 1.5rem;
      font-weight: 700;
      background: linear-gradient(90deg, #D32F2F, #FF1744);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .model-badge {
      background: #FFEBEE;
      color: var(--primary-red);
      padding: 0.4rem 0.8rem;
      border-radius: 20px;
      font-size: 0.85rem;
      font-weight: 600;
      border: 1px solid #FFCDD2;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .container {
      max-width: 1100px;
      width: 100%;
      margin: 0 auto;
      flex: 1;
      display: flex;
      flex-direction: column;
      padding: 1.5rem 1rem;
    }

    .chat-box {
      flex: 1;
      overflow-y: auto;
      padding: 1rem;
      display: flex;
      flex-direction: column;
      gap: 1.25rem;
      margin-bottom: 1rem;
    }

    .message {
      display: flex;
      gap: 1rem;
      max-width: 85%;
      animation: fadeIn 0.3s ease-in-out;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .message.user {
      align-self: flex-end;
      flex-direction: row-reverse;
    }

    .message.assistant {
      align-self: flex-start;
    }

    .avatar {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 600;
      flex-shrink: 0;
    }

    .message.user .avatar {
      background: var(--text-dark);
      color: white;
    }

    .message.assistant .avatar {
      background: var(--primary-red);
      color: white;
      box-shadow: 0 2px 8px rgba(229, 57, 53, 0.3);
    }

    .content {
      background: white;
      padding: 1.1rem 1.4rem;
      border-radius: var(--radius);
      box-shadow: var(--shadow-sm);
      border: 1px solid var(--border-color);
      line-height: 1.6;
      word-break: break-word;
    }

    .message.user .content {
      background: var(--primary-red);
      color: white;
      border: none;
      border-top-right-radius: 2px;
    }

    .message.assistant .content {
      border-top-left-radius: 2px;
    }

    .attached-img {
      max-width: 200px;
      max-height: 200px;
      border-radius: 8px;
      margin-top: 8px;
      display: block;
    }

    .input-panel {
      background: white;
      border-radius: 24px;
      padding: 0.75rem 1rem;
      box-shadow: var(--shadow-lg);
      border: 2px solid #FFCDD2;
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }

    .preview-container {
      display: flex;
      gap: 10px;
      padding: 4px;
    }

    .preview-thumb {
      position: relative;
      display: inline-block;
    }

    .preview-thumb img {
      width: 60px;
      height: 60px;
      object-fit: cover;
      border-radius: 8px;
      border: 2px solid var(--primary-red);
    }

    .remove-img {
      position: absolute;
      top: -6px;
      right: -6px;
      background: var(--primary-red);
      color: white;
      border-radius: 50%;
      width: 20px;
      height: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 10px;
      cursor: pointer;
    }

    .input-row {
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }

    textarea {
      flex: 1;
      border: none;
      outline: none;
      resize: none;
      max-height: 150px;
      font-size: 1rem;
      padding: 0.5rem;
      background: transparent;
    }

    .action-btn {
      background: transparent;
      border: none;
      color: var(--text-muted);
      font-size: 1.25rem;
      cursor: pointer;
      padding: 0.5rem;
      border-radius: 50%;
      transition: all 0.2s ease;
    }

    .action-btn:hover {
      color: var(--primary-red);
      background: #FFEBEE;
    }

    .send-btn {
      background: var(--primary-red);
      color: white;
      border: none;
      width: 44px;
      height: 44px;
      border-radius: 50%;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.1rem;
      transition: all 0.2s ease;
      box-shadow: 0 4px 10px rgba(229, 57, 53, 0.3);
    }

    .send-btn:hover {
      background: var(--primary-hover);
      transform: scale(1.05);
    }

    pre {
      margin: 1rem 0;
      border-radius: 8px;
      overflow: hidden;
    }

    code {
      font-family: 'Fira Code', monospace;
    }

    .code-header {
      background: #212121;
      color: #FFF;
      padding: 0.4rem 1rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.8rem;
    }

    .copy-btn {
      background: rgba(255, 255, 255, 0.15);
      border: none;
      color: white;
      padding: 2px 8px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 0.75rem;
    }

    .copy-btn:hover {
      background: rgba(255, 255, 255, 0.3);
    }

    .typing-indicator {
      display: flex;
      gap: 5px;
      padding: 8px 12px;
    }

    .typing-dot {
      width: 8px;
      height: 8px;
      background: var(--primary-red);
      border-radius: 50%;
      animation: bounce 1.4s infinite ease-in-out both;
    }

    .typing-dot:nth-child(1) { animation-delay: -0.32s; }
    .typing-dot:nth-child(2) { animation-delay: -0.16s; }

    @keyframes bounce {
      0%, 80%, 100% { transform: scale(0); }
      40% { transform: scale(1); }
    }
  </style>
</head>
<body>

  <header>
    <div class="brand">
      <div class="brand-icon"><i class="fa-solid fa-atom"></i></div>
      <div class="brand-title">MSMI AI</div>
    </div>
    <div class="model-badge">
      <i class="fa-solid fa-bolt"></i> Gemini 3.8 Flash Engine
    </div>
  </header>

  <div class="container">
    <div class="chat-box" id="chatBox">
      <div class="message assistant">
        <div class="avatar"><i class="fa-solid fa-robot"></i></div>
        <div class="content">
          Hello! I am <strong>MSMI AI</strong>. I am fully optimized to help you with Mathematics, Coding, Science, Social Sciences, and Image Analysis using Gemini 3.8 Flash. How can I help you today?
        </div>
      </div>
    </div>

    <div class="input-panel">
      <div class="preview-container" id="previewContainer" style="display: none;">
        <div class="preview-thumb">
          <img id="imagePreview" src="" alt="Attachment" />
          <div class="remove-img" onclick="clearImage()"><i class="fa-solid fa-xmark"></i></div>
        </div>
      </div>
      <div class="input-row">
        <input type="file" id="imageInput" accept="image/*" style="display: none;" onchange="handleImageUpload(event)" />
        <button class="action-btn" onclick="document.getElementById('imageInput').click()" title="Attach Image">
          <i class="fa-solid fa-paperclip"></i>
        </button>
        <textarea id="userInput" rows="1" placeholder="Type a message or ask a math problem..." onkeydown="handleKeyDown(event)"></textarea>
        <button class="send-btn" onclick="sendMessage()"><i class="fa-solid fa-paper-plane"></i></button>
      </div>
    </div>
  </div>

  <script>
    /* ====================================================================
       PASTE YOUR GOOGLE API KEY DIRECTLY IN THE LINE BELOW:
       ==================================================================== */
    const API_KEY = "AQ.Ab8RN6LT7Nxr9zQY2K9IPP1UqapfsxhMENCNz_jFt_QQgB3oGg";

    // Validated active endpoints configuration with reliable fallbacks
    const MODELS_TO_TRY = ["gemini-3.8-flash", "gemini-3.5-flash", "gemini-2.5-flash"];

    let attachedImageBase64 = null;

    function handleKeyDown(e) {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        sendMessage();
      }
    }

    function handleImageUpload(e) {
      const file = e.target.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = function(evt) {
          attachedImageBase64 = evt.target.result.split(',')[1];
          document.getElementById('imagePreview').src = evt.target.result;
          document.getElementById('previewContainer').style.display = 'flex';
        };
        reader.readAsDataURL(file);
      }
    }

    function clearImage() {
      attachedImageBase64 = null;
      document.getElementById('imageInput').value = '';
      document.getElementById('previewContainer').style.display = 'none';
    }

    async function sendMessage() {
      const inputEl = document.getElementById('userInput');
      const text = inputEl.value.trim();

      if (!text && !attachedImageBase64) return;

      appendMessage('user', text, attachedImageBase64);
      inputEl.value = '';
      
      const currentImage = attachedImageBase64;
      clearImage();

      const loadingId = appendLoadingIndicator();

      try {
        const reply = await fetchGeminiResponseWithFallback(text, currentImage);
        removeMessage(loadingId);
        appendMessage('assistant', reply);
      } catch (err) {
        removeMessage(loadingId);
        appendMessage('assistant', `⚠️ **Connection Error:** ${err.message}. Please double-check that your API Key is correctly inserted on line 231.`);
      }
    }

    async function fetchGeminiResponseWithFallback(promptText, imageBase64) {
      let lastError = null;

      for (const model of MODELS_TO_TRY) {
        try {
          const response = await fetchGeminiAPI(model, promptText, imageBase64);
          return response;
        } catch (err) {
          console.warn(`Model endpoint ${model} returned error, trying next fallback...`, err.message);
          lastError = err;
        }
      }
      throw lastError || new Error("Could not reach any valid model endpoint.");
    }

    async function fetchGeminiAPI(modelName, promptText, imageBase64) {
      const url = `https://generativelanguage.googleapis.com/v1beta/models/${modelName}:generateContent?key=${API_KEY}`;
      
      const parts = [];
      if (promptText) {
        parts.push({ text: promptText });
      }
      if (imageBase64) {
        parts.push({
          inline_data: {
            mime_type: "image/jpeg",
            data: imageBase64
          }
        });
      }

      const requestBody = {
        contents: [{ parts: parts }],
        systemInstruction: {
          parts: [{ text: "You are MSMI AI, an expert virtual assistant skilled in General Knowledge, Mathematics, Science, Social Science, Coding, and Image Vision. Provide accurate, clear details and format mathematical equations utilizing LaTeX notation ($...$ inline, $$...$$ block equations)." }]
        }
      };

      const res = await fetch(url, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(requestBody)
      });

      const data = await res.json();

      if (!res.ok) {
        throw new Error(data.error?.message || `HTTP error! status: ${res.status}`);
      }

      if (!data.candidates || data.candidates.length === 0 || !data.candidates[0].content) {
        throw new Error("Received empty response candidate structure from API.");
      }

      return data.candidates[0].content.parts[0].text;
    }

    function appendMessage(role, text, imageSrc = null) {
      const chatBox = document.getElementById('chatBox');
      const msgDiv = document.createElement('div');
      msgDiv.className = `message ${role}`;

      const avatarDiv = document.createElement('div');
      avatarDiv.className = 'avatar';
      avatarDiv.innerHTML = role === 'user' ? '<i class="fa-solid fa-user"></i>' : '<i class="fa-solid fa-robot"></i>';

      const contentDiv = document.createElement('div');
      contentDiv.className = 'content';

      if (role === 'assistant') {
        contentDiv.innerHTML = formatMarkdown(text);
        setTimeout(() => {
          renderMathInElement(contentDiv, {
            delimiters: [
              {left: '$$', right: '$$', display: true},
              {left: '$', right: '$', display: false},
              {left: '\\(', right: '\\)', display: false},
              {left: '\\[', right: '\\]', display: true}
            ],
            throwOnError: false
          });
        }, 0);
      } else {
        contentDiv.textContent = text;
        if (imageSrc) {
          const img = document.createElement('img');
          img.src = `data:image/jpeg;base64,${imageSrc}`;
          img.className = 'attached-img';
          contentDiv.appendChild(img);
        }
      }

      msgDiv.appendChild(avatarDiv);
      msgDiv.appendChild(contentDiv);
      chatBox.appendChild(msgDiv);
      chatBox.scrollTop = chatBox.scrollHeight;
    }

    function appendLoadingIndicator() {
      const chatBox = document.getElementById('chatBox');
      const id = 'loading-' + Date.now();
      const msgDiv = document.createElement('div');
      msgDiv.className = 'message assistant';
      msgDiv.id = id;

      msgDiv.innerHTML = `
        <div class="avatar"><i class="fa-solid fa-robot"></i></div>
        <div class="content">
          <div class="typing-indicator">
            <div class="typing-dot"></div>
            <div class="typing-dot"></div>
            <div class="typing-dot"></div>
          </div>
        </div>
      `;
      chatBox.appendChild(msgDiv);
      chatBox.scrollTop = chatBox.scrollHeight;
      return id;
    }

    function removeMessage(id) {
      const el = document.getElementById(id);
      if (el) el.remove();
    }

    function formatMarkdown(text) {
      const renderer = new marked.Renderer();
      renderer.code = function(code, language) {
        const validLang = hljs.getLanguage(language) ? language : 'plaintext';
        const highlighted = hljs.highlight(code, { language: validLang }).value;
        return `<div class="code-container">
                  <div class="code-header">
                    <span>${validLang}</span>
                    <button class="copy-btn" onclick="copyCode(this)">Copy</button>
                  </div>
                  <pre><code class="hljs ${validLang}">${highlighted}</code></pre>
                </div>`;
      };
      return marked.parse(text, { renderer: renderer });
    }

    function copyCode(btn) {
      const code = btn.parentElement.nextElementSibling.innerText;
      navigator.clipboard.writeText(code);
      btn.innerText = 'Copied!';
      setTimeout(() => btn.innerText = 'Copy', 2000);
    }
  </script>
</body>
</html>
