<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MSMI Professional Web Portal</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #fef2f2 0%, #ffffff 100%);
            color: #1f2937;
            min-height: 100vh;
        }
        .glass-card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(220, 38, 38, 0.2);
            box-shadow: 0 10px 30px rgba(220, 38, 38, 0.08);
        }
        .msmi-red { color: #dc2626; }
        .msmi-bg-red { background-color: #dc2626; }
        .msmi-bg-red:hover { background-color: #b91c1c; }
    </style>
</head>
<body class="flex flex-col justify-between items-center p-4 md:p-8 min-h-screen">
    <div class="w-full max-w-5xl">
        <!-- Header -->
        <header class="flex justify-between items-center py-4 mb-8 border-b border-red-100">
            <div class="flex items-center space-x-3">
                <div class="w-10 h-10 rounded-xl msmi-bg-red flex items-center justify-center text-white font-bold text-xl shadow-lg">M</div>
                <div>
                    <h1 class="text-xl font-bold tracking-wider text-gray-900">MSMI <span class="msmi-red">PORTAL</span></h1>
                    <p class="text-xs text-gray-500">Secure Database Management System</p>
                </div>
            </div>
            <div id="header-actions"></div>
        </header>

        <!-- Dynamic Content Container -->
        <main id="app-container" class="w-full">
            <!-- App Views Rendered via JS -->
        </main>
    </div>

    <!-- Footer -->
    <footer class="mt-12 text-center text-xs text-gray-400 py-4">
        &copy; 2026 MSMI Systems. Integrated with Neon DB PostgreSQL.
    </footer>

    <script>
        // State Management
        let currentUser = null;

        // Notification Helper
        function showNotification(message, isError = false) {
            const notif = document.createElement('div');
            notif.className = `fixed top-5 right-5 z-50 px-6 py-3 rounded-xl text-white font-medium shadow-xl transition-all duration-300 transform translate-y-0 ${isError ? 'bg-red-600' : 'bg-zinc-900'}`;
            notif.innerText = message;
            document.body.appendChild(notif);
            setTimeout(() => {
                notif.style.opacity = '0';
                setTimeout(() => notif.remove(), 300);
            }, 3000);
        }

        // Render Login View
        function renderLogin() {
            document.getElementById('header-actions').innerHTML = '';
            document.getElementById('app-container').innerHTML = `
                <div class="max-w-md mx-auto glass-card p-8 rounded-2xl shadow-xl mt-10">
                    <div class="text-center mb-8">
                        <h2 class="text-2xl font-bold text-gray-900">Welcome Back</h2>
                        <p class="text-sm text-gray-500 mt-1">Sign in with your username and password</p>
                    </div>
                    <form id="login-form" onsubmit="handleLogin(event)" class="space-y-5">
                        <div>
                            <label class="block text-xs font-semibold uppercase text-gray-600 mb-1">Username</label>
                            <input type="text" id="username" required autocomplete="username" class="w-full px-4 py-3 rounded-xl border border-gray-200 focus:outline-none focus:ring-2 focus:ring-red-500 transition text-sm">
                        </div>
                        <div>
                            <label class="block text-xs font-semibold uppercase text-gray-600 mb-1">Password</label>
                            <input type="password" id="password" required autocomplete="current-password" class="w-full px-4 py-3 rounded-xl border border-gray-200 focus:outline-none focus:ring-2 focus:ring-red-500 transition text-sm">
                        </div>
                        <button type="submit" class="w-full py-3 msmi-bg-red text-white font-semibold rounded-xl shadow-lg transition duration-200">Sign In</button>
                    </form>
                    <div class="mt-6 text-center">
                        <button onclick="renderResetRequest()" class="text-xs msmi-red font-semibold hover:underline">Forgot password? Request reset from Admin</button>
                    </div>
                </div>
            `;
        }

        // Handle Login Submission
        async function handleLogin(e) {
            e.preventDefault();
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;

            try {
                const res = await fetch('/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });
                const data = await res.json();
                if (data.success) {
                    currentUser = data.user;
                    showNotification("Login successful!");
                    if (currentUser.role === 'admin') {
                        renderAdminDashboard();
                    } else {
                        renderUserDashboard();
                    }
                } else {
                    showNotification(data.message, true);
                }
            } catch (err) {
                showNotification("Error connecting to server endpoint", true);
            }
        }

        // Request Password Reset View
        function renderResetRequest() {
            document.getElementById('app-container').innerHTML = `
                <div class="max-w-md mx-auto glass-card p-8 rounded-2xl shadow-xl mt-10">
                    <div class="text-center mb-8">
                        <h2 class="text-2xl font-bold text-gray-900">Request Password Reset</h2>
                        <p class="text-sm text-gray-500 mt-1">Enter your username to notify ADMINMSMI</p>
                    </div>
                    <form onsubmit="submitResetRequest(event)" class="space-y-5">
                        <div>
                            <label class="block text-xs font-semibold uppercase text-gray-600 mb-1">Username</label>
                            <input type="text" id="reset-username" required class="w-full px-4 py-3 rounded-xl border border-gray-200 focus:outline-none focus:ring-2 focus:ring-red-500 transition text-sm">
                        </div>
                        <button type="submit" class="w-full py-3 msmi-bg-red text-white font-semibold rounded-xl shadow-lg transition">Send Reset Request</button>
                    </form>
                    <div class="mt-6 text-center">
                        <button onclick="renderLogin()" class="text-xs text-gray-600 font-semibold hover:underline">Back to Login</button>
                    </div>
                </div>
            `;
        }

        // Submit Reset Request
        async function submitResetRequest(e) {
            e.preventDefault();
            const username = document.getElementById('reset-username').value;
            try {
                const res = await fetch('/api/user/request-reset', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username })
                });
                const data = await res.json();
                if (data.success) {
                    showNotification(data.message);
                    renderLogin();
                } else {
                    showNotification(data.message, true);
                }
            } catch (err) {
                showNotification("Connection error", true);
            }
        }

        // Logout
        function logout() {
            currentUser = null;
            showNotification("Logged out successfully");
            renderLogin();
        }

        // Render Admin Dashboard
        async function renderAdminDashboard() {
            document.getElementById('header-actions').innerHTML = `
                <div class="flex items-center space-x-4">
                    <span class="text-sm font-semibold text-gray-700">👑 ADMINMSMI</span>
                    <button onclick="logout()" class="px-4 py-2 bg-gray-100 hover:bg-gray-200 text-gray-700 rounded-xl text-sm font-medium transition">Logout</button>
                </div>
            `;

            try {
                const res = await fetch('/api/admin/users');
                const data = await res.json();
                const users = data.users || [];
                const resets = data.resetRequests || [];

                document.getElementById('app-container').innerHTML = `
                    <div class="space-y-8">
                        ${resets.length > 0 ? `
                            <div class="bg-red-50 border border-red-200 p-4 rounded-xl flex items-center justify-between">
                                <div class="flex items-center space-x-3">
                                    <span class="flex h-3 w-3 relative"><span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-red-400 opacity-75"></span><span class="relative inline-flex rounded-full h-3 w-3 bg-red-500"></span></span>
                                    <span class="text-sm font-semibold text-red-900">Password Reset Requests Pending: ${resets.map(r => r.username).join(', ')}</span>
                                </div>
                            </div>
                        ` : ''}

                        <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                            <div class="glass-card p-6 rounded-2xl">
                                <h3 class="text-xs uppercase font-bold text-gray-400">Total System Users</h3>
                                <p class="text-3xl font-extrabold text-gray-900 mt-2">${users.length}</p>
                            </div>
                            <div class="glass-card p-6 rounded-2xl md:col-span-2">
                                <h3 class="text-xs uppercase font-bold text-gray-400 mb-3">Admin Security Settings</h3>
                                <form onsubmit="updateAdminCredentials(event)" class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                                    <input type="text" id="new-admin-user" placeholder="New Admin Username" value="ADMINMSMI" required class="px-4 py-2 border rounded-xl text-sm">
                                    <input type="password" id="new-admin-pass" placeholder="New Admin Password" required class="px-4 py-2 border rounded-xl text-sm">
                                    <button type="submit" class="sm:col-span-2 py-2 msmi-bg-red text-white text-sm font-semibold rounded-xl">Update Admin Credentials</button>
                                </form>
                            </div>
                        </div>

                        <!-- Add User Section -->
                        <div class="glass-card p-6 rounded-2xl">
                            <h3 class="text-lg font-bold text-gray-900 mb-4">Add New User</h3>
                            <form onsubmit="addNewUser(event)" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
                                <input type="text" id="new-username" placeholder="Username" required class="px-4 py-2 border rounded-xl text-sm">
                                <input type="password" id="new-password" placeholder="Password" required class="px-4 py-2 border rounded-xl text-sm">
                                <input type="text" id="new-fullname" placeholder="Full Name" class="px-4 py-2 border rounded-xl text-sm">
                                <input type="text" id="new-bio" placeholder="Bio / Department" class="px-4 py-2 border rounded-xl text-sm">
                                <button type="submit" class="lg:col-span-4 py-2.5 msmi-bg-red text-white font-semibold rounded-xl text-sm shadow">Create User Account</button>
                            </form>
                        </div>

                        <!-- User Directory Table -->
                        <div class="glass-card p-6 rounded-2xl overflow-x-auto">
                            <h3 class="text-lg font-bold text-gray-900 mb-4">Registered Users & Profiles</h3>
                            <table class="w-full text-left border-collapse">
                                <thead>
                                    <tr class="border-b text-xs font-semibold text-gray-500 uppercase">
                                        <th class="py-3 px-4">ID</th>
                                        <th class="py-3 px-4">Username</th>
                                        <th class="py-3 px-4">Role</th>
                                        <th class="py-3 px-4">Full Name</th>
                                        <th class="py-3 px-4">Phone / Address</th>
                                        <th class="py-3 px-4 text-right">Actions</th>
                                    </tr>
                                </thead>
                                <tbody class="divide-y text-sm">
                                    ${users.map(u => `
                                        <tr class="hover:bg-red-50/50 transition">
                                            <td class="py-3 px-4 font-mono text-xs">${u.id}</td>
                                            <td class="py-3 px-4 font-bold">${u.username}</td>
                                            <td class="py-3 px-4"><span class="px-2 py-1 rounded-full text-xs ${u.role === 'admin' ? 'bg-red-100 text-red-700' : 'bg-gray-100 text-gray-700'}">${u.role}</span></td>
                                            <td class="py-3 px-4">${u.full_name || 'N/A'}</td>
                                            <td class="py-3 px-4 text-xs text-gray-500">${u.phone || 'N/A'}<br>${u.address || ''}</td>
                                            <td class="py-3 px-4 text-right space-x-2">
                                                <button onclick="openMessageModal(${u.id}, '${u.username}')" class="px-3 py-1 bg-red-100 text-red-700 rounded-lg text-xs font-semibold hover:bg-red-200">Message</button>
                                                <button onclick="openPasswordModal(${u.id}, '${u.username}')" class="px-3 py-1 bg-gray-100 text-gray-700 rounded-lg text-xs font-semibold hover:bg-gray-200">Reset Pwd</button>
                                                ${u.role !== 'admin' ? `<button onclick="deleteUser(${u.id})" class="px-3 py-1 bg-red-600 text-white rounded-lg text-xs font-semibold hover:bg-red-700">Delete</button>` : ''}
                                            </td>
                                        </tr>
                                    `).join('')}
                                </tbody>
                            </table>
                        </div>
                    </div>
                `;
            } catch (err) {
                showNotification("Failed to load user directory", true);
            }
        }

        // User Dashboard View
        async function renderUserDashboard() {
            document.getElementById('header-actions').innerHTML = `
                <div class="flex items-center space-x-4">
                    <span class="text-sm font-semibold text-gray-700">👤 ${currentUser.username}</span>
                    <button onclick="logout()" class="px-4 py-2 bg-gray-100 hover:bg-gray-200 text-gray-700 rounded-xl text-sm font-medium transition">Logout</button>
                </div>
            `;

            try {
                const res = await fetch(`/api/user/data/${currentUser.id}`);
                const data = await res.json();
                const messages = data.messages || [];
                const profile = data.profile || {};

                document.getElementById('app-container').innerHTML = `
                    <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
                        <div class="lg:col-span-1 space-y-6">
                            <div class="glass-card p-6 rounded-2xl">
                                <h3 class="text-base font-bold text-gray-900 mb-4 flex items-center justify-between">
                                    <span>Messages from Admin</span>
                                    <span class="px-2 py-0.5 bg-red-100 text-red-700 text-xs rounded-full">${messages.length}</span>
                                </h3>
                                <div class="space-y-3 max-h-[350px] overflow-y-auto pr-1">
                                    ${messages.length === 0 ? '<p class="text-xs text-gray-400">No messages from admin yet.</p>' : ''}
                                    ${messages.map(m => `
                                        <div class="p-3 bg-red-50/60 border border-red-100 rounded-xl">
                                            <div class="flex justify-between items-center mb-1">
                                                <span class="text-xs font-bold text-red-800">${m.sender}</span>
                                                <span class="text-[10px] text-gray-400">${new Date(m.created_at).toLocaleDateString()}</span>
                                            </div>
                                            <p class="text-sm text-gray-700">${m.message}</p>
                                        </div>
                                    `).join('')}
                                </div>
                            </div>

                            <div class="glass-card p-6 rounded-2xl">
                                <h3 class="text-base font-bold text-gray-900 mb-4">Change Password</h3>
                                <form onsubmit="changeUserPassword(event)" class="space-y-3">
                                    <input type="password" id="current-pass" placeholder="Current Password" required class="w-full px-3 py-2 border rounded-xl text-sm">
                                    <input type="password" id="new-user-pass" placeholder="New Password" required class="w-full px-3 py-2 border rounded-xl text-sm">
                                    <button type="submit" class="w-full py-2 bg-gray-900 hover:bg-black text-white text-sm font-semibold rounded-xl">Update Password</button>
                                </form>
                            </div>
                        </div>

                        <div class="lg:col-span-2">
                            <div class="glass-card p-8 rounded-2xl">
                                <h3 class="text-xl font-bold text-gray-900 mb-2">Profile Making & Details</h3>
                                <p class="text-xs text-gray-500 mb-6">Manage your account information saved directly in Neon DB.</p>
                                
                                <form onsubmit="updateProfile(event)" class="space-y-5">
                                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                                        <div>
                                            <label class="block text-xs font-semibold uppercase text-gray-600 mb-1">Full Name</label>
                                            <input type="text" id="prof-fullname" value="${profile.full_name || ''}" class="w-full px-4 py-3 border rounded-xl text-sm">
                                        </div>
                                        <div>
                                            <label class="block text-xs font-semibold uppercase text-gray-600 mb-1">Phone Number</label>
                                            <input type="text" id="prof-phone" value="${profile.phone || ''}" class="w-full px-4 py-3 border rounded-xl text-sm">
                                        </div>
                                    </div>
                                    <div>
                                        <label class="block text-xs font-semibold uppercase text-gray-600 mb-1">Bio / Status / Title</label>
                                        <input type="text" id="prof-bio" value="${profile.bio || ''}" class="w-full px-4 py-3 border rounded-xl text-sm">
                                    </div>
                                    <div>
                                        <label class="block text-xs font-semibold uppercase text-gray-600 mb-1">Address</label>
                                        <textarea id="prof-address" rows="3" class="w-full px-4 py-3 border rounded-xl text-sm">${profile.address || ''}</textarea>
                                    </div>
                                    <button type="submit" class="w-full py-3 msmi-bg-red text-white font-semibold rounded-xl shadow-lg transition">Save Profile Changes</button>
                                </form>
                            </div>
                        </div>
                    </div>
                `;
            } catch (err) {
                showNotification("Error loading profile data", true);
            }
        }

        // Dynamic Actions
        async function addNewUser(e) {
            e.preventDefault();
            const body = {
                username: document.getElementById('new-username').value,
                password: document.getElementById('new-password').value,
                full_name: document.getElementById('new-fullname').value,
                bio: document.getElementById('new-bio').value
            };
            const res = await fetch('/api/admin/users', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(body)
            });
            const data = await res.json();
            if (data.success) {
                showNotification("User created successfully!");
                renderAdminDashboard();
            } else {
                showNotification(data.message, true);
            }
        }

        async function deleteUser(id) {
            if (!confirm("Are you sure you want to delete this user?")) return;
            const res = await fetch(`/api/admin/users/${id}`, { method: 'DELETE' });
            const data = await res.json();
            if (data.success) {
                showNotification("User deleted.");
                renderAdminDashboard();
            } else {
                showNotification(data.message, true);
            }
        }

        function openMessageModal(userId, username) {
            const msg = prompt(`Send message to ${username}:`);
            if (!msg) return;
            fetch('/api/admin/messages', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ user_id: userId, message: msg })
            }).then(res => res.json()).then(data => {
                if (data.success) showNotification("Message sent successfully!");
                else showNotification(data.message, true);
            });
        }

        function openPasswordModal(userId, username) {
            const newPassword = prompt(`Enter new password for ${username}:`);
            if (!newPassword) return;
            fetch(`/api/admin/users/${userId}/password`, {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ newPassword })
            }).then(res => res.json()).then(data => {
                if (data.success) {
                    showNotification("Password changed successfully!");
                    renderAdminDashboard();
                } else {
                    showNotification(data.message, true);
                }
            });
        }

        async function updateAdminCredentials(e) {
            e.preventDefault();
            const newUsername = document.getElementById('new-admin-user').value;
            const newPassword = document.getElementById('new-admin-pass').value;
            const res = await fetch('/api/admin/credentials', {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ newUsername, newPassword })
            });
            const data = await res.json();
            if (data.success) {
                showNotification("Admin credentials updated!");
            } else {
                showNotification(data.message, true);
            }
        }

        async function updateProfile(e) {
            e.preventDefault();
            const body = {
                full_name: document.getElementById('prof-fullname').value,
                bio: document.getElementById('prof-bio').value,
                phone: document.getElementById('prof-phone').value,
                address: document.getElementById('prof-address').value
            };
            const res = await fetch(`/api/user/profile/${currentUser.id}`, {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(body)
            });
            const data = await res.json();
            if (data.success) {
                showNotification("Profile updated successfully!");
                renderUserDashboard();
            } else {
                showNotification(data.message, true);
            }
        }

        async function changeUserPassword(e) {
            e.preventDefault();
            const currentPassword = document.getElementById('current-pass').value;
            const newPassword = document.getElementById('new-user-pass').value;
            const res = await fetch(`/api/user/password/${currentUser.id}`, {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ currentPassword, newPassword })
            });
            const data = await res.json();
            if (data.success) {
                showNotification("Password changed successfully!");
                document.getElementById('current-pass').value = '';
                document.getElementById('new-user-pass').value = '';
            } else {
                showNotification(data.message, true);
            }
        }

        // Start App
        renderLogin();
    </script>
</body>
</html>
