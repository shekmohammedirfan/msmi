<style>

:root{--ac:#ff1f1f;--e1:#ff1a1a;--e2:#ff7a00;--e3:#ff1a1a;--ew:3px;--eg:18px;--es:6s;--bg:#050507;--card:#111116;--card2:#1a1a21;--ln:#23232b;--tx:#f4f4f7;--mu:#9a9aa8;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;background:#000;color:var(--tx);font-family:Inter,Roboto,system-ui,-apple-system,"Segoe UI",sans-serif;overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;transition:transform .15s,background .2s,color .2s}button:active{transform:scale(.92)}
input,select{font:inherit;color:inherit}.ic{display:block;flex:none}.fill{fill:currentColor}
#app{position:relative;max-width:480px;height:100%;margin:0 auto;display:flex;flex-direction:column;background:radial-gradient(110% 40% at 50% 0,#1a0709 0,var(--bg) 70%);overflow:hidden}
.hd{display:flex;align-items:center;gap:6px;padding:14px 14px 8px 18px}
.brand{font-weight:800;letter-spacing:1px;font-size:22px;color:var(--ac);flex:1;text-shadow:0 0 18px color-mix(in srgb,var(--ac) 50%,transparent)}
.ttl{font-size:17px;font-weight:600;flex:1;margin-left:6px}
.ib{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;flex:none}.ib:hover{background:var(--card2)}
.tb{display:flex;border-bottom:1px solid var(--ln);margin:0 6px}.tb button{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px 0 10px;font-size:11px;color:#c9c9d2;position:relative}
.tb button.on{color:var(--ac)}.tb button.on::after{content:"";position:absolute;bottom:-1px;left:22%;right:22%;height:2px;background:var(--ac);box-shadow:0 0 10px var(--ac);border-radius:2px}
main{flex:1;overflow-y:auto;padding:12px 16px 14px;scrollbar-width:none}main::-webkit-scrollbar{display:none}main.in{animation:vin .35s ease}
h2{font-size:15px;margin:20px 0 8px;display:flex;justify-content:space-between;align-items:center;font-weight:600}h2 a{color:var(--mu);font-weight:500;font-size:12px;cursor:pointer}
.hero{border-radius:16px;padding:20px 18px;background:linear-gradient(110deg,#240508,#0c0c10 80%);border:1px solid #3a1116;position:relative;overflow:hidden;display:flex;align-items:center;justify-content:space-between;min-height:112px}
.hero h1{margin:0 0 12px;font-size:20px;line-height:1.2;font-weight:700}.hero b{color:var(--ac);font-size:15px;letter-spacing:1px}
.hart{width:92px;height:92px;border-radius:50%;border:2px solid var(--ac);box-shadow:0 0 30px color-mix(in srgb,var(--ac) 60%,transparent);display:grid;place-items:center;overflow:hidden;background:#150608;color:var(--ac);animation:glow 3.5s ease-in-out infinite;flex:none}.hart img{width:100%;height:100%;object-fit:cover}
.qp{display:grid;grid-template-columns:1fr 1fr;gap:12px}.qp button{display:flex;align-items:center;gap:10px;justify-content:center;padding:14px;border-radius:12px;background:#190709;border:1px solid var(--ac);font-weight:600;font-size:14px;box-shadow:0 0 16px color-mix(in srgb,var(--ac) 18%,transparent)}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;padding:13px;border-radius:14px;background:var(--card);border:1px solid color-mix(in srgb,var(--ac) 40%,#222);font-weight:600;font-size:14px;width:100%}.btn.pri{background:var(--ac);border-color:var(--ac);color:#fff}
.pills{display:flex;gap:4px;padding:4px;border-radius:99px;background:var(--card);overflow-x:auto;scrollbar-width:none;margin-bottom:8px}.pills button{flex:1 0 auto;padding:8px 14px;border-radius:99px;font-size:13px;font-weight:600;color:#d4d4dc;white-space:nowrap}.pills button.on{background:var(--ac);color:#fff;box-shadow:0 0 14px color-mix(in srgb,var(--ac) 45%,transparent)}
.chip{padding:8px 16px;border-radius:99px;background:var(--card);font-size:13px;font-weight:600;color:#d4d4dc;white-space:nowrap;display:inline-flex;align-items:center;gap:6px;flex:none}.chip.on{background:var(--ac);color:#fff}.tabs{display:flex;gap:8px;overflow-x:auto;padding:10px 0;scrollbar-width:none}
.search{width:100%;padding:12px 14px;border-radius:12px;border:1px solid var(--ln);background:var(--card);outline:0;margin-bottom:6px}.search:focus{border-color:var(--ac)}
.sbar{display:flex;align-items:center;gap:10px;padding:0 14px;border-radius:12px;border:1px solid var(--ln);background:var(--card);color:var(--mu)}.sbar input{flex:1;background:none;border:0;outline:0;padding:12px 0;color:var(--tx)}
.song{display:flex;align-items:center;gap:12px;padding:9px 4px;cursor:pointer;animation:rise .4s both;animation-delay:calc(var(--i,0)*35ms);border-radius:10px}.song:active{background:var(--card)}.song.cur .tt{color:var(--ac)}
.lr{border-bottom:1px solid #15151a;border-radius:0}
.art{width:44px;height:44px;border-radius:9px;flex:none;display:grid;place-items:center;background:var(--card2);border:1px solid #24242c;color:#e6e6ee;overflow:hidden;position:relative}.art img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.mt{flex:1;min-width:0}.tt{font-size:14px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.sb{font-size:11.5px;color:var(--mu);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}.dur{font-size:12px;color:var(--mu)}
.th{width:100px;aspect-ratio:16/9;border-radius:8px;flex:none;position:relative;overflow:hidden;background:linear-gradient(135deg,#2a0b0e,#111);display:grid;place-items:center;color:var(--ac)}.th img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}.th span{position:absolute;right:4px;bottom:3px;background:#000b;font-size:10px;padding:1px 4px;border-radius:4px;font-weight:600}
.yt2 .tt{white-space:normal;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.eqb{display:flex;gap:3px;align-items:flex-end;height:18px;z-index:1}.eqb i{width:3px;background:var(--ac);border-radius:2px;animation:eq .8s ease-in-out infinite}.eqb i:nth-child(2){animation-delay:.2s}.eqb i:nth-child(3){animation-delay:.4s}
.empty{text-align:center;color:var(--mu);padding:30px 10px;font-size:14px;line-height:1.5}
.card{background:var(--card);border-radius:16px;padding:14px;margin-bottom:12px}
.set{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 0;font-size:14px;border-bottom:1px solid var(--ln)}.set:last-child{border:0}
.set input[type=range]{width:50%;accent-color:var(--ac)}.set input[type=color]{width:44px;height:30px;border:0;background:none;padding:0}.set select{background:var(--card2);border:1px solid #2a2a35;border-radius:8px;padding:6px}
.sw{appearance:none;width:44px;height:26px;border-radius:99px;background:#333;position:relative;transition:.25s;flex:none}.sw:checked{background:var(--ac)}.sw::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:.25s}.sw:checked::after{left:21px}
.pre{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}.pre button{padding:7px 12px;border-radius:10px;font-size:12px;font-weight:600;border:1px solid #333;display:flex;align-items:center;gap:6px}.pre i{width:12px;height:12px;border-radius:50%}.pre .on{border-color:var(--ac);color:var(--ac)}
#ytw{max-height:0;overflow:hidden;padding:0 16px;transition:max-height .4s}#ytw.show{max-height:320px;padding-bottom:6px}#ytf{width:100%;aspect-ratio:16/9;border:0;border-radius:12px;background:#000;display:block}
#mini{display:none;align-items:center;gap:10px;margin:0 8px 8px;padding:9px 10px;border-radius:12px;background:#15151b;border:1px solid #2a1417;position:relative;overflow:hidden;animation:rise .4s}
#mini .bar{position:absolute;left:0;top:0;height:2px;background:var(--ac);width:0;box-shadow:0 0 8px var(--ac)}
#np{position:absolute;inset:0;z-index:20;background:#000;display:none;flex-direction:column;padding:12px 22px 18px;transform:translateY(100%);transition:transform .35s cubic-bezier(.2,.8,.2,1);overflow-y:auto}#np.open{transform:none}
#np::before{content:"";position:absolute;left:0;right:0;top:0;height:60%;background:radial-gradient(70% 55% at 50% 38%,#2d0709,transparent 75%);pointer-events:none}#np>*{position:relative}
.rw{margin:18px auto 6px;width:min(64vw,270px);aspect-ratio:1;transform:scale(calc(1 + var(--b,0)*.07));transition:transform .08s}
.ring{width:100%;height:100%;border-radius:50%;padding:12px;border:3px solid var(--ac);box-shadow:0 0 50px color-mix(in srgb,var(--ac) 65%,transparent),inset 0 0 36px color-mix(in srgb,var(--ac) 45%,transparent)}
.ringart{width:100%;height:100%;border-radius:50%;overflow:hidden;display:grid;place-items:center;background:radial-gradient(circle at 35% 30%,#3b0c10,#0a0a0d);color:var(--ac);font-size:80px;font-weight:800;position:relative}.ringart img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
canvas{width:100%;height:44px;display:block;margin-top:6px}
input[type=range].seek{-webkit-appearance:none;appearance:none;height:18px;background:transparent;width:100%;margin:0}
.seek::-webkit-slider-runnable-track{height:3px;border-radius:3px;background:linear-gradient(var(--ac),var(--ac)) 0/var(--p,0%) 100% no-repeat,#44444c}.seek::-webkit-slider-thumb{-webkit-appearance:none;width:12px;height:12px;border-radius:50%;background:var(--ac);margin-top:-4.5px;box-shadow:0 0 8px var(--ac)}
.seek::-moz-range-track{height:3px;border-radius:3px;background:#44444c}.seek::-moz-range-progress{height:3px;background:var(--ac)}.seek::-moz-range-thumb{width:12px;height:12px;border:0;border-radius:50%;background:var(--ac)}
.ctl{display:flex;align-items:center;justify-content:space-between}.ctl button{width:48px;height:48px;border-radius:50%;display:grid;place-items:center}.ctl .on{color:var(--ac)}
.ctl .pp{width:66px;height:66px;background:var(--ac);color:#fff;box-shadow:0 0 28px color-mix(in srgb,var(--ac) 65%,transparent)}
.nb{display:flex;align-items:center;justify-content:space-between;margin-top:22px;color:var(--ac)}.nb .hx{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:500}
#sheet{position:absolute;inset:0;z-index:30;background:#000a;display:none;align-items:flex-end}#sheet>div{width:100%;max-height:82%;overflow:auto;background:var(--card);border-radius:22px 22px 0 0;padding:18px 18px calc(18px + env(safe-area-inset-bottom,0px));animation:up .3s cubic-bezier(.2,.8,.2,1)}
#sheet h3{margin:0 0 10px}.mi{padding:13px 4px;border-bottom:1px solid #22222c;font-size:15px;display:flex;align-items:center;gap:12px;width:100%;text-align:left}.mi small{color:var(--mu);margin-left:auto}
.in{width:100%;padding:12px;border-radius:12px;border:1px solid #333;background:var(--card2);margin:6px 0 12px;outline:0}
.fx{display:grid;grid-template-columns:64px 1fr;gap:8px;align-items:center;font-size:13px;margin:8px 0}.fx input{accent-color:var(--ac);width:100%}
#splash{position:absolute;inset:0;z-index:60;background:radial-gradient(90% 50% at 50% 38%,#1c0507,#000 70%);display:flex;flex-direction:column;align-items:center;transition:opacity .6s,visibility .6s;padding-top:17%}#splash.off{opacity:0;visibility:hidden}
#splash .lg{animation:pop .9s cubic-bezier(.2,.9,.3,1.2) both,glow 2s 1s ease-in-out infinite;border-radius:50%}
#splash h1{margin:22px 0 4px;font-size:21px;letter-spacing:.5px;font-weight:700;animation:rise .8s .3s both}#splash h1 b{color:var(--ac)}#splash i{color:var(--ac);font-family:"Brush Script MT","Segoe Script",cursive;font-size:21px;animation:rise .8s .5s both}
.spec{display:flex;gap:4px;align-items:flex-end;height:78px;margin-top:auto;-webkit-box-reflect:below 0 linear-gradient(transparent 40%,#0005)}.spec span{width:5px;background:linear-gradient(var(--ac),#9a0000);border-radius:1px;animation:eq 1s ease-in-out infinite}
.ldt{margin:34px 0 8px;font-size:13px;color:#ddd}.ldb{width:62%;height:3px;border-radius:3px;background:#2a2a30;margin-bottom:8%;overflow:hidden}.ldb div{height:100%;width:0;background:var(--ac);box-shadow:0 0 10px var(--ac);animation:load 2.6s ease-in-out forwards}
#edgeW{position:fixed;inset:0;pointer-events:none;z-index:100;filter:drop-shadow(0 0 var(--eg) var(--e1));opacity:var(--eo,1)}
#edge{position:absolute;inset:0;padding:var(--ew);border-radius:var(--er,0);background:conic-gradient(from var(--a),var(--e1),var(--e2),var(--e3),var(--e1));-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask:linear-gradient(#000 0 0) content-box exclude,linear-gradient(#000 0 0)}
#edgeG{position:fixed;inset:0;pointer-events:none;z-index:99;box-shadow:inset 0 0 calc(var(--eg)*2.2) calc(var(--eg)*.25) var(--e1);opacity:calc(var(--eo,1)*.45)}
body.m-spin #edge{animation:spin var(--es) linear infinite}body.m-pulse #edgeW{animation:pulse calc(var(--es)/3) ease-in-out infinite}body.m-off #edgeW,body.m-off #edgeG{display:none}
@keyframes spin{to{--a:360deg}}@keyframes pulse{50%{opacity:.35}}@keyframes glow{50%{box-shadow:0 0 34px var(--ac)}}@keyframes rise{from{opacity:0;transform:translateY(10px)}}@keyframes vin{from{opacity:0;transform:translateY(8px)}}@keyframes up{from{transform:translateY(40px);opacity:0}}@keyframes eq{0%,100%{height:15%}50%{height:100%}}@keyframes pop{from{opacity:0;transform:scale(.6)}}@keyframes load{to{width:100%}}
</style></head>

<div class="set"><span>3D Audio</span><input type="checkbox" class="sw" ${S.d3?'checked':''} onchange="S.d3=this.checked;SV('msmi_set',S)"></div><div style="font-size:13px;margin-top:8px">Speed</div><div class="pre">${[.75,1,1.25,1.5,2].map(r=>`<button class="${S.rate===r?'on':''}" data-a="spd" data-v="${r}">${r}x</button>`).join('')}</div>`)}
/* actions */
const A={
ps:(v,e)=>play(v,LST[e.dataset.l]),mn:songMenu,go:v=>go(v),back:()=>go('home'),folder:()=>$('#fFolder').click(),files:()=>$('#fFiles').click(),
srch:()=>{if(view==='yt'){const q=$('#yq');q&&q.focus()}else{lib.so=true;go('local');setTimeout(()=>$('#sq')&&$('#sq').focus(),60)}},
menu:()=>sheet(`<h3>Menu</h3>`+mi('go','local','music','Local music')+mi('plv','','list','Playlists')+mi('favv','','heart','Favorites')+mi('fx','','eq','Harmonic Effects')+mi('tmr','','timer','Sleep timer')+mi('folder','','folder','Open music folder')+mi('go','set','gear','Settings')),
plv:()=>{closeSheet();lib.tab='Playlists';plOpen=null;go('local')},favv:()=>{closeSheet();lib.tab='Favorites';go('local')},seeall:()=>{lib.tab='Songs';lib.sort='recent';go('local')},
fav:v=>{FAV.has(v)?FAV.delete(v):FAV.add(v);SV('msmi_fav',[...FAV]);closeSheet();render()},
atp:v=>addTo(v),pn:v=>{queue.splice(qi+1,0,v);closeSheet();toast('Playing next')},
pa:v=>{if(!PL[v].includes(pend))PL[v].push(pend);SV('msmi_pl',PL);closeSheet();toast('Added to '+v);render()},
npc:()=>{const n=$('#npn').value.trim();if(!n)return;PL[n]=PL[n]||[];if(pend&&!PL[n].includes(pend))PL[n].push(pend);SV('msmi_pl',PL);closeSheet();toast('Playlist saved');render()},
npl:()=>{pend=null;sheet(`<h3>New playlist</h3><input class="in" id="npn" placeholder="Playlist name"><button class="btn pri" data-a="npc">Create</button>`)},
plo:v=>{plOpen=v;render()},plb:()=>{plOpen=null;render()},plp:()=>{const l=PL[plOpen].filter(i=>byId[i]);if(l.length)play(l[0],l)},
pld:()=>{if(confirm('Delete this playlist?')){delete PL[plOpen];SV('msmi_pl',PL);plOpen=null;render()}},prm:v=>{PL[plOpen]=PL[plOpen].filter(i=>i!==v);SV('msmi_pl',PL);closeSheet();render()},
nx:()=>next(),pv:()=>prev(),sh:()=>{shuf=!shuf;ui()},rp:()=>{rep=(rep+1)%3;ui()},npx:()=>openNP(false),
npm:()=>{const t=cur();if(!t)return;sheet(`<h3>${esc(t.title)}</h3>`+(mode==='local'?mi('fav',t.id,'heart',FAV.has(t.id)?'Remove from favorites':'Add to favorites')+mi('atp',t.id,'plus','Add to playlist')+mi('que','','list','Queue'):mi('yfv',yt.id,'heart','Save video'))+mi('fx','','eq','Harmonic Effects')+mi('tmr','','timer','Sleep timer'))},
fx:fxSheet,fxp:v=>{S.fx=FXP[v].slice();applyFx();SV('msmi_set',S);fxSheet()},spd:v=>{S.rate=+v;au.playbackRate=S.rate;SV('msmi_set',S);fxSheet()},
que:()=>{sheet(`<h3>Up next</h3>`+(queue.map((id,i)=>byId[id]?`<div class="mi" style="cursor:pointer" data-a="qp" data-v="${i}"><span style="color:${i===qi?'var(--ac)':'inherit'};flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(byId[id].title)}</span><button class="ib" data-a="qr" data-v="${i}">${I('x',16)}</button></div>`:'').join('')||'<div class="empty">Queue is empty</div>'))},
qp:v=>{qi=+v;load();closeSheet()},qr:v=>{v=+v;queue.splice(v,1);if(v<qi)qi--;else if(v===qi){qi=Math.min(qi,queue.length-1);if(queue.length)load();else au.pause()}A.que()},
tmr:()=>sheet(`<h3>Sleep timer</h3>`+[15,30,45,60,0].map(m=>mi('slp',m,'timer',m?m+' minutes':'Off')).join('')),
slp:v=>{clearTimeout(sleepT);sleepEnd=0;if(+v){sleepEnd=Date.now()+v*6e4;sleepT=setTimeout(()=>{au.pause();if(mode==='yt')ytCmd('pauseVideo');sleepEnd=0;ui();toast('Sleep timer ended')},v*6e4);toast('Sleep in '+v+' min')}closeSheet();ui()},
ysr:()=>ytGo($('#yq').value.trim()),yt_:v=>{ytTab=v;if(v==='Trending')ytSearch('',1);else if(v==='Top Music')ytSearch('top music');else render()},
ypl:v=>ytPlay(+v,ytTab==='Playlists'?YF:ytRes),yfv:v=>{const r=ytRes.find(x=>x.id===v)||yt.list.find(x=>x.id===v);if(r&&!YF.some(x=>x.id===v)){YF.push({id:r.id,title:r.title,ch:r.ch,dur:r.dur});SV('msmi_yf',YF);toast('Saved to Playlists')}closeSheet()},
yo:()=>window.open('https://www.youtube.com/results?search_query='+encodeURIComponent($('#yq')?$('#yq').value:''),'_blank'),
sav:async()=>{try{const d=await claude.use('downloads');await d.save({filename:'MSMI_MUSIC_PLAYER.html',data:'<!DOCTYPE html>\n'+document.documentElement.outerHTML})}catch(e){toast('Download not available here')}},
rst:()=>{if(confirm('Reset all settings, playlists and favorites?')){localStorage.clear();location.reload()}},
tab:v=>{lib.tab=v;lib.f=null;plOpen=null;render()},sub:(v,e)=>{lib.f=[e.dataset.k,v];render()},lb:()=>{lib.f=null;render()},pre:v=>{const c=PRESETS[v];S.c1=c[0];S.c2=c[1];S.c3=c[2];applyTheme();render()}};
document.addEventListener('click',e=>{if(lp===-1){lp=0;return}const t=e.target.closest('[data-a]');if(t&&A[t.dataset.a])A[t.dataset.a](t.dataset.v,t,e)});
document.addEventListener('pointerdown',e=>{const r=e.target.closest('.lr[data-v]');if(!r)return;lp=setTimeout(()=>{lp=-1;songMenu(r.dataset.v)},550)});
['pointerup','pointermove','pointercancel'].forEach(v=>document.addEventListener(v,()=>{if(lp>0){clearTimeout(lp);lp=0}}));
document.addEventListener('contextmenu',e=>{const r=e.target.closest('.lr[data-v]');if(r){e.preventDefault();songMenu(r.dataset.v)}});
document.addEventListener('keydown',e=>{if(/INPUT|SELECT/.test(e.target.tagName))return;if(e.code==='Space'){e.preventDefault();toggle()}if(e.code==='ArrowRight'&&mode==='local')au.currentTime+=5;if(e.code==='ArrowLeft'&&mode==='local')au.currentTime-=5});
/* youtube (search needs network + API key: works in the saved standalone file) */
function ytGo(q){const r=q.match(/(?:v=|youtu\.be\/|embed\/|shorts\/)([\w-]{11})/)||q.match(/^([\w-]{11})$/);if(r){ytPlay(0,[{id:r[1],title:'YouTube video',ch:'YouTube'}]);return}if(q)ytSearch(q)}
async function ytSearch(q,trend){const k=S.ytk;ytTab=trend?'Trending':ytTab==='Playlists'?'Top Music':ytTab;ytMsg='';
if(!k){ytMsg='To search YouTube by song title, add a YouTube API key in Settings. You can also paste any YouTube link above.';ytRes=[];return render()}
ytMsg='Searching...';render();try{const u=trend?`https://www.googleapis.com/youtube/v3/videos?part=snippet&chart=mostPopular&videoCategoryId=10&regionCode=IN&maxResults=20&key=${k}`:`https://www.googleapis.com/youtube/v3/search?part=snippet&type=video&videoCategoryId=10&maxResults=20&q=${encodeURIComponent(q)}&key=${k}`;
const j=await(await fetch(u)).json();if(j.error)throw new Error(j.error.message);const de=s=>s.replace(/&amp;|&#39;|&quot;/g,m=>({'&amp;':'&','&#39;':"'",'&quot;':'"'}[m]));
ytRes=(j.items||[]).map(x=>({id:x.id.videoId||x.id,title:de(x.snippet.title),ch:x.snippet.channelTitle}));ytMsg=ytRes.length?'':'No results';render();
try{const d=await(await fetch(`https://www.googleapis.com/youtube/v3/videos?part=contentDetails&id=${ytRes.map(v=>v.id).join(',')}&key=${k}`)).json();d.items.forEach(x=>{const v=ytRes.find(y=>y.id===x.id),m=x.contentDetails.duration.match(/PT(?:(\d+)H)?(?:(\d+)M)?(?:(\d+)S)?/);if(v)v.dur=(+m[1]||0)*3600+(+m[2]||0)*60+(+m[3]||0)});render()}catch(e){}}
catch(e){ytRes=[];ytMsg='Could not reach YouTube ('+(e.message||'network blocked')+'). The in-chat preview blocks outside requests: use Settings > Save standalone app and open that file to search.';render()}}
/* views */
const TABS=[['home','home','Home'],['local','file','Local'],['yt','yt','YouTube'],['set','gear','Settings']];
function go(v){view=v;if(v!=='local'){plOpen=null;lib.f=null}render()}
function hdr(){if(view==='home')return`<div class="hd"><div class="brand">MSMI</div><button class="ib" data-a="srch">${I('search',22)}</button><button class="ib" data-a="menu">${I('menu',22)}</button></div><div class="tb">${TABS.map(t=>`<button class="${t[0]==='home'?'on':''}" data-a="go" data-v="${t[0]}">${I(t[1],22)}${t[2]}</button>`).join('')}</div>`;
const n={local:'Local Music',yt:'YouTube Music',set:'Settings'}[view];return`<div class="hd" style="padding-left:8px"><button class="ib" data-a="back">${I('back',22)}</button><div class="ttl">${n}</div>${view==='set'?'':`<button class="ib" data-a="srch">${I('search',22)}</button><button class="ib" data-a="menu">${I('more',22)}</button>`}</div>`}
function hrow(t,k,i){return`<div class="song lr" style="--i:${Math.min(i,12)}" data-a="ps" data-v="${esc(t.id)}" data-l="${k}"><div class="art">${artOf(t)}</div><div class="mt"><div class="tt">${esc(t.title)}</div><div class="sb">${esc(artist(t))}</div></div><span class="dur">${t.dur?fmt(t.dur):''}</span><button class="ib" data-a="mn" data-v="${esc(t.id)}">${I('more',18)}</button></div>`}
function lrow(t,k,i){const c=mode==='local'&&queue[qi]===t.id;return`<div class="song lr${c?' cur':''}" style="--i:${Math.min(i,12)}" data-a="ps" data-v="${esc(t.id)}" data-l="${k}"><div class="art">${c&&!au.paused?'<div class="eqb"><i></i><i></i><i></i></div>':artOf(t)}</div><div class="mt"><div class="tt">${esc(t.title)}</div><div class="sb">${esc(artist(t))}</div></div><span class="dur">${t.dur?fmt(t.dur):''}</span></div>`}
const list=(ts,k,f=lrow)=>{LST[k]=ts.map(t=>t.id);return ts.length?ts.map((t,i)=>f(t,k,i)).join(''):'<div class="empty">Nothing here yet</div>'};
const openB=()=>`<div class="qp" style="margin-top:14px"><button data-a="folder">${I('folder',20)}Open Folder</button><button data-a="files">${I('file',20)}Open Files</button></div>`;
function yrow(v,i){return`<div class="song yt2" style="--i:${Math.min(i,12)}" data-a="ypl" data-v="${i}"><div class="th">${I('play',20)}${ythumb(v.id)}${v.dur?`<span>${fmt(v.dur)}</span>`:''}</div><div class="mt"><div class="tt">${esc(v.title)}</div><div class="sb">${esc(v.ch)}</div></div><button class="ib" data-a="yfv" data-v="${esc(v.id)}">${I('heart',18)}</button></div>`}
function body(){
if(view==='home'){const rec=REC.map(i=>byId[i]).filter(Boolean).slice(0,3),fav=[...FAV].map(i=>byId[i]).filter(Boolean),lt=cur()&&mode==='local'?cur():rec[0];
return`<div class="hero"><div><h1>Good Music<br>Better Mood</h1><b>MSMI</b></div><div class="hart">${lt&&lt.pic?`<img src="${lt.pic}" alt="">`:I('headphones',44)}</div></div>
<h2>Recently Played ${rec.length?'<a data-a="seeall">See All</a>':''}</h2>${rec.length?list(rec,'r',hrow):'<div class="empty">Play something and it will show up here</div>'}
${fav.length?'<h2>Favorites</h2>'+list(fav.slice(0,4),'f',hrow):''}
<h2>Quick Play</h2><div class="qp"><button data-a="go" data-v="local"><span style="color:var(--ac)">${I('music',24)}</span>Local Files</button><button data-a="go" data-v="yt"><span style="color:var(--ac)">${I('ytl',26)}</span>YouTube</button></div>`}
if(view==='local'){const tabs=['Songs','Artists','Albums','Folders','Playlists','Favorites'];let h=`<div class="pills">${tabs.map(x=>`<button class="${lib.tab===x?'on':''}" data-a="tab" data-v="${x}">${x}</button>`).join('')}</div>`;
if(!T.length&&lib.tab!=='Playlists')return h+'<div class="empty">No songs yet.<br>Open a folder or pick files from your device.</div>'+openB();
if(lib.tab==='Playlists'){if(plOpen&&PL[plOpen]){const ts=PL[plOpen].map(i=>byId[i]).filter(Boolean);return h+`<h2>${esc(plOpen)} <a data-a="plb">All playlists</a></h2><div class="qp"><button data-a="plp">${I('play',18)}Play</button><button data-a="pld">${I('trash',18)}Delete</button></div><div style="height:6px"></div>${list(ts,'p')}`}
return h+`<button class="btn pri" data-a="npl">${I('plus',18)}New Playlist</button><div style="height:8px"></div>`+(Object.keys(PL).map((k,i)=>`<div class="song lr" style="--i:${i}" data-a="plo" data-v="${esc(k)}"><div class="art">${I('list',20)}</div><div class="mt"><div class="tt">${esc(k)}</div><div class="sb">${PL[k].length} songs</div></div></div>`).join('')||'<div class="empty">Create a playlist, then hold a song to add it.</div>')}
if(lib.tab==='Artists'||lib.tab==='Albums'||lib.tab==='Folders'){if(!lib.f){const k={Artists:'artist',Albums:'album',Folders:'folder'}[lib.tab],gr={};T.forEach(t=>{const n=t[k]||(k==='artist'?'<unknown>':'<unknown>');(gr[n]=gr[n]||[]).push(t)});
return h+(Object.keys(gr).sort().map((n,i)=>{const pic=(gr[n].find(t=>t.pic)||{}).pic;return`<div class="song lr" style="--i:${Math.min(i,12)}" data-a="sub" data-k="${k}" data-v="${esc(n)}"><div class="art">${pic?`<img src="${pic}" alt="">`:I(k==='artist'?'mic':k==='folder'?'folder':'music',20)}</div><div class="mt"><div class="tt">${esc(n)}</div><div class="sb">${gr[n].length} songs</div></div></div>`}).join(''))}}
let ts=lib.tab==='Favorites'?T.filter(t=>FAV.has(t.id)):T.slice();if(lib.f)ts=ts.filter(t=>(t[lib.f[0]]||'<unknown>')===lib.f[1]);const q=lib.q.toLowerCase();if(q)ts=ts.filter(t=>(t.title+' '+t.artist).toLowerCase().includes(q));
ts.sort((a,b)=>lib.sort==='artist'?a.artist.localeCompare(b.artist):lib.sort==='recent'?b.added-a.added:lib.sort==='plays'?(PC[b.id]||0)-(PC[a.id]||0):a.title.localeCompare(b.title));
return h+(lib.f?`<button class="chip on" data-a="lb" style="margin-bottom:8px">${I('back',14)} ${esc(lib.f[1])}</button>`:'')+(lib.so||lib.q?`<div style="display:flex;gap:8px"><input class="search" id="sq" placeholder="Search songs or artists" value="${esc(lib.q)}" oninput="lib.q=this.value;render();const e=$('#sq');e.focus();e.setSelectionRange(99,99)"><select class="search" style="width:104px" onchange="lib.sort=this.value;render()">${[['title','A–Z'],['artist','Artist'],['recent','Recent'],['plays','Played']].map(o=>`<option value="${o[0]}"${lib.sort===o[0]?' selected':''}>${o[1]}</option>`).join('')}</select></div>`:'')+list(ts,'c')}
if(view==='yt'){const lst=ytTab==='Playlists'?YF:ytRes;return`<div class="sbar">${I('search',18)}<input id="yq" placeholder="Search YouTube..." onkeydown="if(event.key==='Enter')A.ysr()"></div>
<div class="tabs">${['Trending','Top Music','Playlists'].map(x=>`<button class="chip${ytTab===x?' on':''}" data-a="yt_" data-v="${x}">${x}</button>`).join('')}</div>
${ytMsg&&ytTab!=='Playlists'?`<div class="card" style="font-size:13px;color:var(--mu);line-height:1.5">${esc(ytMsg)}<br><br><button class="chip" data-a="yo">${I('ext',14)}Open results on YouTube</button></div>`:''}
${lst.map((v,i)=>yrow(v,i)).join('')||(ytTab==='Playlists'?'<div class="empty">Saved videos appear here</div>':'')}`}
return settings()}
function render(){const m=$('#main'),keep=m.scrollTop,sq=document.activeElement&&document.activeElement.id==='yq'?document.activeElement.value:null;
$('#hd').innerHTML=hdr();m.innerHTML=body();m.scrollTop=keep;if(sq!==null&&$('#yq'))$('#yq').value=sq;
if(view!==lastView){m.classList.remove('in');void m.offsetWidth;m.classList.add('in');lastView=view;m.scrollTop=0;if(view==='yt'&&!ytAuto&&S.ytk){ytAuto=true;ytSearch('',1)}}
$('#ytw').classList.toggle('show',view==='yt'&&!!yt.id);icons()}
function settings(){const sl=(k,l,a,b)=>`<div class="set"><span>${l}</span><input type="range" min="${a}" max="${b}" value="${S[k]}" oninput="S.${k}=+this.value;applyTheme()"></div>`,co=(k,l)=>`<div class="set"><span>${l}</span><input type="color" value="${S[k]}" oninput="S.${k}=this.value;applyTheme()"></div>`,sw=(k,l)=>`<div class="set"><span>${l}</span><input type="checkbox" class="sw" ${S[k]?'checked':''} onchange="S.${k}=this.checked;applyTheme()"></div>`;
return`<h2 style="margin-top:4px">Edge Light</h2><div class="card">${sw('edge','Enable edge light')}<div class="set"><span>Animation</span><select onchange="S.mode=this.value;applyTheme()">${[['spin','Rotating'],['pulse','Pulsing'],['static','Static']].map(o=>`<option value="${o[0]}"${S.mode===o[0]?' selected':''}>${o[1]}</option>`).join('')}</select></div>${sw('react','React to music')}${co('c1','Colour 1')}${co('c2','Colour 2')}${co('c3','Colour 3')}${sl('w','Thickness',1,10)}${sl('glow','Glow',0,50)}${sl('speed','Cycle time (seconds)',2,20)}${sl('round','Corner radius',0,48)}
<div class="pre">${Object.entries(PRESETS).map(([n,c])=>`<button data-a="pre" data-v="${n}"><i style="background:linear-gradient(90deg,${c[0]},${c[1]})"></i>${n}</button>`).join('')}</div></div>
<h2>Appearance</h2><div class="card">${co('accent','Accent colour')}</div>
<h2>YouTube</h2><div class="card"><div style="font-size:13px;color:var(--mu);margin-bottom:6px">YouTube Data API key (for title search)</div><input class="in" style="margin-bottom:0" value="${esc(S.ytk)}" placeholder="Paste API key" onchange="S.ytk=this.value.trim();ytAuto=false;SV('msmi_set',S)"></div>
<h2>App</h2><div class="card"><button class="btn" data-a="folder">${I('folder',18)}Add music folder</button><div style="height:8px"></div><button class="btn" data-a="sav">${I('dl',18)}Save standalone app (enables YouTube search)</button><div style="height:8px"></div><button class="btn" data-a="rst">${I('trash',18)}Reset app data</button></div>
<p style="text-align:center;color:var(--mu);font-size:12px">MSMI_MUSIC_PLAYER · Play Your World</p>`}
/* boot */
$('#slg').innerHTML=LOGO(124);$('#spec').innerHTML=Array.from({length:30},(_,i)=>`<span style="animation-delay:${(i*37%11)/10}s;animation-duration:${.7+(i*13%7)/10}s"></span>`).join('');
applyTheme();icons();render();ui();setTimeout(()=>$('#splash').classList.add('off'),2900);
</script></body></html>
