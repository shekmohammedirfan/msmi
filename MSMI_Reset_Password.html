<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#c8102e">
<title>MSMI · Reset Password</title>
<style>
:root{--red:#c8102e;--dark:#8f0b22;--ink:#171717;--muted:#6b7280}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:22px;background:radial-gradient(circle at 10% 10%,#ffe5e9,transparent 38%),linear-gradient(135deg,#fff,#fff6f7);font-family:Inter,system-ui,Segoe UI,Arial,sans-serif;color:var(--ink)}.card{position:relative;isolation:isolate;width:min(460px,100%);padding:34px;background:#fff;border:1px solid #f2c5cc;border-radius:22px;box-shadow:0 15px 50px #9f0d2418}.card:before{content:"";position:absolute;inset:-2px;border-radius:inherit;padding:2px;z-index:-1;pointer-events:none;background:conic-gradient(from 0deg,transparent 0 55%,#ff173d 66%,#fff 70%,#c8102e 76%,transparent 86% 100%);-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;filter:drop-shadow(0 0 6px #ff1744);animation:spin 3.4s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}.brand{font-weight:900;letter-spacing:2px;color:var(--red);font-size:13px}.logo{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;background:linear-gradient(145deg,#e21b3c,#85091e);color:white;font-weight:900;margin-bottom:18px;box-shadow:0 0 18px #c8102e55}h1{font-size:27px;margin:18px 0 8px}p{font-size:13px;color:var(--muted);line-height:1.6}label{display:block;font-size:12px;font-weight:750;margin:16px 0 7px}input{width:100%;padding:13px;border:1px solid #ddd;border-radius:10px;font:inherit;outline:none}input:focus{border-color:var(--red);box-shadow:0 0 0 3px #c8102e18}button{width:100%;margin-top:18px;padding:14px;border:0;border-radius:10px;color:#fff;background:linear-gradient(100deg,var(--red),var(--dark));font-weight:800;cursor:pointer}button:disabled{opacity:.6}.status{min-height:38px;margin-top:14px;font-size:12px;line-height:1.5}.error{color:#b42318}.success{color:#087443}.back{display:inline-block;margin-top:12px;color:var(--red);font-size:12px;text-decoration:none;font-weight:750}@media(prefers-reduced-motion:reduce){.card:before{animation:none}}
</style>
</head><body>
<main class="card"><div class="logo">MS</div><div class="brand">MSMI ACCOUNT PORTAL</div><h1>Set a new password</h1><p>This secure page is opened from your Supabase password-recovery email. Enter your new password below.</p>
<form id="resetForm"><label for="password">New password</label><input id="password" type="password" minlength="8" autocomplete="new-password" required placeholder="At least 8 characters"><label for="confirm">Confirm new password</label><input id="confirm" type="password" minlength="8" autocomplete="new-password" required placeholder="Enter it again"><button id="submit" type="submit">Update password</button></form><div id="status" class="status" role="status" aria-live="polite"></div><a class="back" href="./">← Back to MSMI Account Portal</a></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
// Copy the SAME project URL and publishable key used by the main portal.
const SUPABASE_URL="YOUR_SUPABASE_PROJECT_URL";
const SUPABASE_PUBLISHABLE_KEY="YOUR_SUPABASE_PUBLISHABLE_KEY";
const statusEl=document.getElementById('status'),form=document.getElementById('resetForm'),button=document.getElementById('submit');
function status(message,type=''){statusEl.textContent=message;statusEl.className='status '+type;}
const configured=SUPABASE_URL.startsWith('https://')&&!SUPABASE_URL.includes('YOUR_')&&!SUPABASE_PUBLISHABLE_KEY.includes('YOUR_');
const client=configured?window.supabase.createClient(SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY,{auth:{flowType:'pkce',detectSessionInUrl:true,persistSession:true,autoRefreshToken:true}}):null;
let recoveryReady=false;
async function checkRecovery(){if(!client){status('Add your Supabase project URL and publishable key in this file first.','error');return;}try{const {data,error}=await client.auth.getSession();if(error)throw error;if(data.session){recoveryReady=true;status('Recovery link verified. You can now set your new password.','success');return;}const hash=new URLSearchParams(location.hash.slice(1));if(hash.get('error_description'))throw new Error(hash.get('error_description').replace(/\+/g,' '));status('No valid recovery session was found. Request a fresh password-reset email from the MSMI portal and open the newest link.','error');}catch(e){status(e.message||'Could not verify recovery link.','error');}}
client?.auth.onAuthStateChange((event,session)=>{if(event==='PASSWORD_RECOVERY'&&session){recoveryReady=true;status('Recovery link verified. You can now set your new password.','success');}});
form.addEventListener('submit',async e=>{e.preventDefault();if(!client)return status('Supabase is not configured in this reset page.','error');const a=document.getElementById('password').value,b=document.getElementById('confirm').value;if(a.length<8)return status('Password must contain at least 8 characters.','error');if(a!==b)return status('The passwords do not match.','error');button.disabled=true;button.textContent='Updating…';try{const {data:{session},error:sessionError}=await client.auth.getSession();if(sessionError)throw sessionError;if(!session||!recoveryReady)throw new Error('Your recovery link is invalid or expired. Request a new reset email and open the newest link.');const {error}=await client.auth.updateUser({password:a});if(error)throw error;await client.auth.signOut();history.replaceState({},document.title,location.pathname);form.reset();status('Password updated successfully. Return to the MSMI portal and sign in with your new password.','success');}catch(e){status(e.message||'Password update failed.','error');}finally{button.disabled=false;button.textContent='Update password';}});
checkRecovery();
</script></body></html>
